services:
    cobalt:
        # built locally from this repository instead of pulling a
        # prebuilt image, so you run exactly the code you reviewed
        build:
            context: ../..
        image: cobalt-hardened:local

        init: true
        read_only: true
        restart: unless-stopped
        container_name: cobalt

        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp

        ports:
            # published on loopback only: the instance is reachable from
            # this machine (or via your own reverse proxy), not the network
            - 127.0.0.1:9000:9000/tcp

        environment:
            # replace with the url you'll use to reach the instance,
            # or else tunneling functionality won't work properly
            API_URL: "http://127.0.0.1:9000/"

            # only this origin may call the api from a browser.
            # set it to wherever you host cobalt web, or leave unset
            # to disallow cross-origin requests entirely.
            # CORS_URL: "https://127.0.0.1:5173"

            # api keys: when API_KEY_URL is set, every request must carry
            # `Authorization: Api-Key <uuid>` (see /docs/protect-an-instance.md)
            API_KEY_URL: "file:///keys.json"

            # if you want to use cookies for fetching data from services,
            # uncomment the next line & the cookies volume below
            # COOKIE_PATH: "/cookies.json"

        volumes:
            - ./keys.json:/keys.json:ro
            # - ./cookies.json:/cookies.json:ro

    # updates are intentionally manual: pull the repository, review the
    # changes, then `docker compose up -d --build`. automatic updaters like
    # watchtower need access to the docker socket (root on the host) and
    # deploy whatever gets published without review.
